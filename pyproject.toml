[project]
name = "cauce"
version = "0.1.0"
description = "Motor de ciclo de vida previsional (acumulación + des-acumulación) + capa MCP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Fabián Rubio" }]

dependencies = [
    # Numérico — vive en infrastructure/ (ADR-010), nunca en domain/
    "numpy>=2.1",
    "scipy>=1.14",
    # Validación / tipado — application/infrastructure/interfaces (no domain)
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Persistencia
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Inyección de dependencias (composition root)
    "injector>=0.22",
    # Entrega
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "fastmcp>=2.0",
]

[project.optional-dependencies]
# Fase 2 — optimización de la senda de planeo (no se instala en el MVP)
acumulacion = ["cvxpy>=1.5"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "httpx>=0.27",
]

[project.scripts]
cauce-mcp = "cauce.interfaces.mcp.server:main"  # servidor MCP (stdio) para Claude Desktop

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cauce"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# N: pep8-naming — el dominio usa español (Afiliado, SaldoPrevisional...), idiomático.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------
# mypy --strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
mypy_path = "src"
packages = ["cauce"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "reproducibilidad: property-tests de determinismo (perfil, mortalidad, semilla)",
]

# ---------------------------------------------------------------------------
# import-linter — blindaje de la frontera (ADR-010, §5.1)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "cauce"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Capas Clean Architecture (domain en el fondo)"
type = "layers"
layers = [
    "cauce.interfaces",
    "cauce.application",
    "cauce.domain",
]

[[tool.importlinter.contracts]]
name = "Dominio puro: stdlib-only, sin frameworks ni numérico (ADR-010)"
type = "forbidden"
source_modules = ["cauce.domain"]
forbidden_modules = [
    "numpy",
    "scipy",
    "pydantic",
    "sqlalchemy",
    "psycopg",
    "fastapi",
    "fastmcp",
    "uvicorn",
    "injector",
    "cauce.application",
    "cauce.infrastructure",
    "cauce.interfaces",
]

[[tool.importlinter.contracts]]
name = "Application usa puertos, no adaptadores ni numérico"
type = "forbidden"
source_modules = ["cauce.application"]
forbidden_modules = [
    "numpy",
    "scipy",
    "cauce.infrastructure",
    "cauce.interfaces",
]
