services:
  postgres:
    image: postgres:16-alpine
    container_name: cauce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cauce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cauce}
      POSTGRES_DB: ${POSTGRES_DB:-cauce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cauce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cauce} -d ${POSTGRES_DB:-cauce}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cauce_pgdata:
